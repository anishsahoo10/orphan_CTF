{% extends "base.html" %}

{% block content %}
<div style="max-width: 420px; margin: 40px auto;">
  <div class="card">
    <div class="card-header">
      <span>Executive Authentication</span>
      <span class="badge-muted">Port 8000</span>
    </div>

    <div class="card-body">
      {% if error %}
      <div class="error-banner" style="margin-bottom: 16px; padding: 10px 14px;">
        <div style="font-weight: 600; color: #fb7185; font-size: 12px;">{{ error }}</div>
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ next_url }}">

        <div style="margin-bottom: 16px;">
          <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">
            Username / Identifier
          </label>
          <input 
            type="text" 
            name="username" 
            class="search-input" 
            style="padding-left: 14px;"
            placeholder="e.g. d.mercer" 
            value="{{ username | default('') }}" 
            required 
            autofocus
          >
        </div>

        <div style="margin-bottom: 24px;">
          <label style="display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px;">
            Password
          </label>
          <input 
            type="password" 
            name="password" 
            class="search-input" 
            style="padding-left: 14px;"
            placeholder="••••••••••••" 
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 13px;">
          Authenticate Session &rarr;
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
