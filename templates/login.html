{% extends "base.html" %}

{% block content %}
<div style="max-width: 460px; margin: 40px auto;">
  
  <div class="big-hero" style="text-align: center; margin-bottom: 24px;">
    <h1 class="big-heading" style="font-size: 32px;">Executive Sign In</h1>
    <p class="hero-sub" style="font-size: 14px;">
      Authenticate with your operator credentials to unlock the Classified Surveillance Vault.
    </p>
  </div>

  <div class="dossier-card" style="padding: 32px;">
    
    {% if error %}
    <div style="background: rgba(244, 63, 94, 0.15); border: 1px solid var(--accent-rose); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px;">
      <div style="font-weight: 700; color: #fb7185; font-size: 13px;">{{ error }}</div>
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}">

      <div style="margin-bottom: 18px;">
        <label style="display: block; font-family: var(--font-heading); font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">
          Username
        </label>
        <input 
          type="text" 
          name="username" 
          class="search-big-input" 
          style="width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--bg-surface);"
          placeholder="e.g. d.mercer" 
          value="{{ username | default('') }}" 
          required 
          autofocus
        >
      </div>

      <div style="margin-bottom: 28px;">
        <label style="display: block; font-family: var(--font-heading); font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em;">
          Password
        </label>
        <input 
          type="password" 
          name="password" 
          class="search-big-input" 
          style="width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--bg-surface);"
          placeholder="••••••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 15px;">
        AUTHENTICATE SESSION &rarr;
      </button>
    </form>

  </div>

</div>
{% endblock %}
