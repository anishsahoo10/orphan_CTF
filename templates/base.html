<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }} &bull; AETHELGARD ARCHIVES</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-wrap">
      
      <!-- Logo / Brand -->
      <a href="/" class="brand">
        <div class="brand-symbol">A</div>
        <div class="brand-text">AETHELGARD</div>
        <span class="brand-tag">CLASSIFIED LEAKS</span>
      </a>

      <!-- Menu Items -->
      <nav class="nav-menu">
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Archive Search</a>
        <a href="/flights" class="nav-link {% if request.url.path == '/flights' %}active{% endif %}">Flight Logs</a>
        <a href="/photos" class="nav-link {% if request.url.path == '/photos' %}active{% endif %}">
          {% if current_user %}Evidence Photos{% else %}🔒 Evidence Photos{% endif %}
        </a>
        <a href="/status" class="nav-link {% if request.url.path == '/status' %}active{% endif %}">Telemetry</a>
      </nav>

      <!-- Right User Controls -->
      <div class="nav-actions">
        {% if current_user %}
          <span style="font-size: 13px; font-weight: 600; color: var(--accent-emerald);">● {{ current_user.username }}</span>
          <a href="/logout" class="btn btn-danger" style="padding: 6px 14px; font-size: 13px;">Sign Out</a>
        {% else %}
          <a href="/login" class="btn btn-primary" style="padding: 6px 16px; font-size: 13px;">Sign In</a>
        {% endif %}
      </div>

    </div>
  </header>

  <!-- Main Content Stage -->
  <main class="main-wrapper">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
